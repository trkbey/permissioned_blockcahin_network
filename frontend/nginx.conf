server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: bilinmeyen yollar index.html'e duser.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Arayuz backend'e ayni origin uzerinden konusur; boylece cookie'ler
    # SameSite=Strict ile calisir ve tarayici CORS'a hic ihtiyac duymaz.
    location /api/ {
        proxy_pass http://backend-api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
