<!DOCTYPE html>
<html lang="tr" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Besu Notary - Web3 Industrial Platform</title>
    <link rel="stylesheet" href="style.css?v=3">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="app-background">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
    </div>

    <div class="app-container">
        <header class="glass-header">
            <div class="logo">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10">
                        </path>
                    </svg>
                </div>
                <h1>TableVerifier</h1>
            </div>
            <nav class="main-tabs">
                <button class="main-tab-btn active" data-target="addData">
                    <span>+</span> Add
                </button>
                <button class="main-tab-btn" data-target="verifyData">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor">
                        <path stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                    Verify
                </button>
            </nav>
        </header>

        <main class="content-wrapper">
            <!-- Add Data Section -->
            <section id="addData" class="view-section active">
                <div class="section-header fade-in">
                    <h2>Add Data</h2>

                </div>

                <div class="pill-nav slide-up" id="addTableNav">
                    <button class="pill-btn active" data-table="production">production</button>
                    <button class="pill-btn" data-table="employee">employee</button>
                    <button class="pill-btn" data-table="machine">machine</button>
                    <button class="pill-btn" data-table="product">product</button>
                    <button class="pill-btn" data-table="shift">shift</button>
                    <button class="pill-btn" data-table="factory">factory</button>
                    <button class="pill-btn" data-table="date">date</button>
                </div>

                <div class="glass-card form-card slide-up delay-1">
                    <div class="card-title-bar">
                        <h3 id="formTitle">Add Production Record</h3>

                    </div>
                    <form id="dynamicForm">
                        <div id="formInputs" class="form-grid"></div>
                        <div class="form-actions">
                            <button type="submit" class="glow-btn" id="submitBtn">
                                <span class="btn-text">Save</span>
                                <div class="spinner hidden" id="submitSpinner"></div>
                            </button>
                        </div>
                    </form>
                </div>
            </section>

            <!-- Verify Section -->
            <section id="verifyData" class="view-section">
                <div class="section-header fade-in">
                    <h2>Verification</h2>
                </div>

                <div class="pill-nav slide-up" id="verifyTableNav">
                    <button class="pill-btn active" data-table="production">production</button>
                    <button class="pill-btn" data-table="employee">employee</button>
                    <button class="pill-btn" data-table="machine">machine</button>
                    <button class="pill-btn" data-table="product">product</button>
                    <button class="pill-btn" data-table="shift">shift</button>
                    <button class="pill-btn" data-table="factory">factory</button>
                    <button class="pill-btn" data-table="date">date</button>
                </div>

                <div class="glass-card table-card slide-up delay-1">
                    <div class="table-actions">
                        <h3 id="tableTitle">Production Records</h3>
                        <button id="refreshBtn" class="icon-btn" title="Refresh Data">
                            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" fill="none">
                                <path stroke-width="2"
                                    d="M21 2v6h-6M3 12a9 9 0 0115-6.7L21 8M3 22v-6h6M21 12a9 9 0 01-15 6.7L3 16" />
                            </svg>
                            refresh
                        </button>
                    </div>
                    <div class="table-responsive">
                        <table class="data-table">
                            <thead id="tableHead"></thead>
                            <tbody id="tableBody"></tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <div class="modal-overlay hidden" id="verifyModal">
        <div class="glass-modal scale-in">
            <button class="close-modal" id="closeModal">×</button>
            <div class="modal-content">
                <div id="modalLoader" class="modal-state">
                    <div class="large-spinner"></div>
                    <h2>Searching</h2>
                </div>

                <div id="modalResult" class="modal-state hidden">
                    <div class="status-banner" id="statusBanner">
                        <div class="status-icon" id="statusIcon"></div>
                        <h3 id="statusMessage"></h3>
                    </div>

                    <div class="hash-details">
                        <div class="hash-box">
                            <span>Local Hash</span>
                            <code id="dbHashText"></code>
                        </div>
                        <div class="hash-box">
                            <span>Blockchain Original Hash</span>
                            <code id="chainHashText"></code>
                        </div>
                        <div class="hash-box highlight-box">
                            <span>TxHash</span>
                            <code id="txHashText"></code>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js?v=5"></script>
</body>

</html>
