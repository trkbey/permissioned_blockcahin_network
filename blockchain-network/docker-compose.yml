# this file is linked to the .env file generated by generate-network.js
# first run the command npm install && node generate-network.js
# security note
# admin API is disabled only ETH, NET, QBFT, WEB3 are enabled
# --rpc-http-cors-origins is not specified at all Bess default is "no origin"
# only the backend accesses the RPC the browser does not
# only validator1s RPC connects to 127.0.0.1 
# the backend does not connect to this port it connects to http://validator1:8545 via besu-net

x-besu-common: &besu-common
  image: hyperledger/besu:26.7.1
  restart: unless-stopped

x-besu-command: &besu-command >
  --genesis-file=/config/genesis.json
  --data-path=/opt/besu/data
  --node-private-key-file=/opt/besu/keys/key
  --rpc-http-enabled
  --rpc-http-api=ETH,NET,QBFT,WEB3
  --rpc-http-host=0.0.0.0
  --rpc-http-port=8545
  --host-allowlist=localhost,127.0.0.1,validator1,validator2,validator3,validator4
  --p2p-port=30303
  --min-gas-price=0
  --bootnodes=${BESU_BOOTNODES:?generate-network.js calistirilmali - .env eksik}

networks:
  besu-net:
    name: blockchain-network_besu-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

services:
  validator1:
    <<: *besu-common
    container_name: validator1
    environment:
      BESU_OPTS: -Xmx1g
      BESU_P2P_HOST: 172.28.0.11
    networks:
      besu-net:
        ipv4_address: 172.28.0.11
    ports:
      # Yalnızca localhost. Dışarıya açık DEĞİL.
      - "127.0.0.1:9545:8545"
    volumes:
      - ./networkFiles/genesis.json:/config/genesis.json:ro
      - ./networkFiles/keys/validator1/key:/opt/besu/keys/key:ro
      - besu_data_1:/opt/besu/data
    command: *besu-command

  validator2:
    <<: *besu-common
    container_name: validator2
    environment:
      BESU_OPTS: -Xmx1g
      BESU_P2P_HOST: 172.28.0.12
    networks:
      besu-net:
        ipv4_address: 172.28.0.12
    volumes:
      - ./networkFiles/genesis.json:/config/genesis.json:ro
      - ./networkFiles/keys/validator2/key:/opt/besu/keys/key:ro
      - besu_data_2:/opt/besu/data
    command: *besu-command

  validator3:
    <<: *besu-common
    container_name: validator3
    environment:
      BESU_OPTS: -Xmx1g
      BESU_P2P_HOST: 172.28.0.13
    networks:
      besu-net:
        ipv4_address: 172.28.0.13
    volumes:
      - ./networkFiles/genesis.json:/config/genesis.json:ro
      - ./networkFiles/keys/validator3/key:/opt/besu/keys/key:ro
      - besu_data_3:/opt/besu/data
    command: *besu-command

  validator4:
    <<: *besu-common
    container_name: validator4
    environment:
      BESU_OPTS: -Xmx1g
      BESU_P2P_HOST: 172.28.0.14
    networks:
      besu-net:
        ipv4_address: 172.28.0.14
    volumes:
      - ./networkFiles/genesis.json:/config/genesis.json:ro
      - ./networkFiles/keys/validator4/key:/opt/besu/keys/key:ro
      - besu_data_4:/opt/besu/data
    command: *besu-command

volumes:
  besu_data_1:
  besu_data_2:
  besu_data_3:
  besu_data_4:
