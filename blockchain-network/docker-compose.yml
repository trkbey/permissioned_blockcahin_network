version: "3.8"

x-besu-common: &besu-common
  image: hyperledger/besu:latest
  restart: unless-stopped

networks:
  besu-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

services:
  validator1:
    <<: *besu-common
    container_name: validator1
    networks:
      besu-net:
        ipv4_address: 172.28.0.11
    ports:
      - "9545:8545"
    volumes:
      - ./networkFiles/genesis.json:/config/genesis.json:ro
      - ./networkFiles/keys/0x49ed9cf6097b66cd13ac98ba9dd277f0fc02651a/key:/opt/besu/keys/key:ro
      - ./data/validator1:/opt/besu/database
    command: >
      --genesis-file=/config/genesis.json
      --node-private-key-file=/opt/besu/keys/key
      --rpc-http-enabled
      --rpc-http-api=ETH,NET,QBFT,ADMIN,WEB3
      --rpc-http-host=0.0.0.0
      --rpc-http-port=8545
      --rpc-http-cors-origins=*
      --host-allowlist=*
      --p2p-host=172.28.0.11
      --p2p-port=30303
      --min-gas-price=0
      --bootnodes=enode://178338ab034f881345f208e70289baf81b464c55d146c610c8a24bf2ef13bb847f1555ce0baf66587e96379267f3853f2be63e688de4670f321b9fb14e6acd4c@172.28.0.11:30303,enode://4454f890538c11f7b3b88a66da04010c89a2b246362bc9abbe3e26e3250a855f21be81ae9599fe6dc1081b89363e7ffe8f5bbed014a7cc40961d5bddb3f4d8fd@172.28.0.12:30303,enode://07ab4ff42b81f61b95bf351b0a60fcd689d26226b2d3cda95bf3da5dc6bc94c4ca3dc36ac1661a6ecd7d4775f624bff4a0d3bb66bcf322c0ff789b028150c627@172.28.0.13:30303

